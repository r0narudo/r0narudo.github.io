<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      background: #efece6;
      color: #161513;
    }
    body[data-theme="ink"] { background: #121110; color: #f6f3ee; }
    body[data-theme="mist"] { background: #e6eaef; color: #1c2128; }
    main {
      width: min(34rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
      text-align: center;
    }
    .avatar {
      width: 6.5rem; height: 6.5rem; border-radius: 999px;
      object-fit: cover; margin: 0 auto 1rem;
      box-shadow: 0 0 0 4px rgb(255 255 255 / 55%);
      background: #161513; color: #fbf9f5;
      display: grid; place-items: center; font-size: 1.6rem; font-weight: 650;
    }
    h1 { margin: 0; font-size: 1.65rem; letter-spacing: -0.03em; }
    p.bio { margin: 0.4rem 0 1.6rem; color: #6e6962; line-height: 1.5; }
    body[data-theme="ink"] p.bio { color: #a39e95; }
    .links { display: grid; gap: 0.75rem; }
    a.link {
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: 3.5rem; padding: 0.75rem 3rem; border-radius: 999px;
      background: #fbf9f5; color: #161513; text-decoration: none; font-weight: 650;
      border: 1px solid #e6e0d6;
      box-shadow: 0 1px 2px rgb(22 21 19 / 6%), 0 8px 24px rgb(22 21 19 / 6%);
    }
    body[data-theme="ink"] a.link { background: #f6f3ee; border-color: transparent; }
    body[data-theme="mist"] a.link { background: #fff; border-color: #d7dee6; }
    a.link:hover { transform: translateY(-2px); }
    .mark { position: absolute; left: 1.15rem; width: 1.25rem; height: 1.25rem; }
  </style>
</head>
